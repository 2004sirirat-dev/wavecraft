<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavecraft — generate a song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14141c;
    --ink-2:#1c1c26;
    --ink-3:#26262f;
    --bone:#efebe3;
    --bone-dim:#a8a49c;
    --lime:#d4ff3f;
    --violet:#8b7fd9;
    --line: rgba(239,235,227,0.1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--bone);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    margin:0;
  }

  /* NAV */
  nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 48px;
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-mark{
    width:14px;height:14px;
    background:var(--lime);
    border-radius:3px;
    transform:rotate(45deg);
  }
  .nav-links{display:flex;gap:32px;align-items:center;}
  .nav-links a{color:var(--bone-dim);text-decoration:none;font-size:14px;}
  .nav-links a:hover{color:var(--bone);}
  .nav-cta{
    background:var(--bone);
    color:var(--ink);
    border:none;
    padding:10px 18px;
    border-radius:100px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  /* HERO / CREATE PANEL */
  .create-section{
    max-width:760px;
    margin:0 auto;
    padding:72px 24px 56px;
    text-align:center;
  }
  .create-section h1{
    font-size:44px;
    letter-spacing:-0.02em;
    margin-bottom:14px;
  }
  .create-section p.sub{
    color:var(--bone-dim);
    font-size:16px;
    margin-bottom:40px;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .create-panel{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    text-align:left;
  }
  #prompt{
    width:100%;
    background:transparent;
    border:none;
    color:var(--bone);
    font-family:'Inter',sans-serif;
    font-size:16px;
    resize:none;
    outline:none;
    min-height:56px;
  }
  #prompt::placeholder{color:var(--bone-dim);}
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:16px 0 20px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .chip{
    border:1px solid var(--line);
    background:transparent;
    color:var(--bone-dim);
    padding:7px 14px;
    border-radius:100px;
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .chip.active{
    border-color:var(--lime);
    color:var(--lime);
  }
  .panel-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .duration-label{font-size:13px;color:var(--bone-dim);}
  .generate-btn{
    background:var(--lime);
    color:var(--ink);
    border:none;
    padding:12px 22px;
    border-radius:100px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .generate-btn:disabled{opacity:0.6;cursor:default;}
  .generate-btn svg{width:14px;height:14px;}

  /* FEED */
  .feed-section{
    max-width:1120px;
    margin:0 auto;
    padding:24px 24px 100px;
  }
  .feed-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:20px;
  }
  .feed-header h2{font-size:20px;}
  .feed-header span{font-size:13px;color:var(--bone-dim);}
  .feed-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:16px;
  }
  .card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--line);background:var(--ink-3);}
  .wave{
    height:64px;
    display:flex;
    align-items:flex-end;
    gap:3px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .wave span{
    flex:1;
    background:var(--violet);
    border-radius:2px;
    opacity:0.5;
    transition:opacity .2s;
  }
  .card.playing .wave span{
    opacity:1;
    animation:bounce 0.9s ease-in-out infinite;
  }
  @keyframes bounce{
    0%,100%{transform:scaleY(0.4);}
    50%{transform:scaleY(1);}
  }
  .card-title{font-size:15px;font-weight:600;margin-bottom:4px;}
  .card-meta{font-size:13px;color:var(--bone-dim);margin-bottom:12px;}
  .card-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .tag{
    font-size:11px;
    color:var(--bone-dim);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:100px;
  }
  .play-btn{
    width:32px;height:32px;
    border-radius:50%;
    background:var(--ink-3);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--bone);
    flex-shrink:0;
  }
  .card.playing .play-btn{background:var(--lime);color:var(--ink);border-color:var(--lime);}
  .play-btn svg{width:12px;height:12px;}

  @media (max-width:640px){
    nav{padding:18px 20px;}
    .nav-links{display:none;}
    .create-section{padding:48px 16px 40px;}
    .create-section h1{font-size:32px;}
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>
<body>
<h2 class="sr-only">Wavecraft: an AI song generator with a prompt-based create panel and a feed of generated songs to browse and play.</h2>

<nav>
  <div class="logo"><span class="logo-mark"></span>Wavecraft</div>
  <div class="nav-links">
    <a href="#">Discover</a>
    <a href="#">Library</a>
    <a href="#">Pricing</a>
    <button class="nav-cta">Sign up</button>
  </div>
</nav>

<section class="create-section">
  <h1>Describe a song. Get the whole track.</h1>
  <p class="sub">Lyrics, melody, and vocals — generated from a sentence.</p>

  <div class="create-panel">
    <textarea id="prompt" placeholder="A road-trip song about leaving a small town, warm and a little wistful..."></textarea>
    <div class="chip-row" id="chips">
      <button class="chip active">Pop</button>
      <button class="chip">Acoustic</button>
      <button class="chip">Lo-fi</button>
      <button class="chip">Cinematic</button>
      <button class="chip">Lullaby</button>
      <button class="chip">Hip-hop</button>
    </div>
    <div class="panel-footer">
      <span class="duration-label" id="durationLabel">~90 sec · vocals on</span>
      <button class="generate-btn" id="generateBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        Generate
      </button>
    </div>
  </div>
</section>

<section class="feed-section">
  <div class="feed-header">
    <h2>Discover</h2>
    <span id="countLabel">6 songs</span>
  </div>
  <div class="feed-grid" id="feedGrid"></div>
</section>

<script>
const seedSongs = [
  {title:"Leaving Elm Street", meta:"Pop · 1:42", tag:"Pop"},
  {title:"Static and Streetlights", meta:"Lo-fi · 2:10", tag:"Lo-fi"},
  {title:"Paper Boats", meta:"Acoustic · 1:58", tag:"Acoustic"},
  {title:"The Long Way Home", meta:"Cinematic · 2:34", tag:"Cinematic"},
  {title:"Sleepy Little Bear", meta:"Lullaby · 1:20", tag:"Lullaby"},
  {title:"Corner Store Legend", meta:"Hip-hop · 2:05", tag:"Hip-hop"}
];

const grid = document.getElementById('feedGrid');
const countLabel = document.getElementById('countLabel');

function makeWave(){
  let bars = '';
  const n = 28;
  for(let i=0;i<n;i++){
    const h = 8 + Math.round(Math.random()*56);
    bars += `<span style="height:${h}px"></span>`;
  }
  return bars;
}

function renderCard(song, prepend){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="wave">${makeWave()}</div>
    <div class="card-title">${song.title}</div>
    <div class="card-meta">${song.meta}</div>
    <div class="card-foot">
      <span class="tag">${song.tag}</span>
      <div class="play-btn" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
  `;
  card.addEventListener('click', () => {
    document.querySelectorAll('.card.playing').forEach(c => { if(c!==card) c.classList.remove('playing'); });
    card.classList.toggle('playing');
  });
  if(prepend){
    grid.prepend(card);
  } else {
    grid.appendChild(card);
  }
}

seedSongs.forEach(s => renderCard(s, false));

// chips
document.getElementById('chips').addEventListener('click', (e) => {
  if(e.target.classList.contains('chip')){
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
  }
});

// generate flow (front-end simulation — wire to /api/lyrics + /api/song on the backend)
const btn = document.getElementById('generateBtn');
const promptEl = document.getElementById('prompt');

btn.addEventListener('click', () => {
  const val = promptEl.value.trim();
  if(!val){
    promptEl.placeholder = "Type an idea first...";
    promptEl.focus();
    return;
  }
  const style = document.querySelector('.chip.active').textContent;
  btn.disabled = true;
  btn.textContent = 'Generating...';

  setTimeout(() => {
    const title = val.split(' ').slice(0,4).join(' ').replace(/[.,!?]$/,'');
    renderCard({
      title: title.charAt(0).toUpperCase()+title.slice(1),
      meta: `${style} · ${Math.floor(60+Math.random()*90)} sec`,
      tag: style
    }, true);
    countLabel.textContent = grid.children.length + ' songs';
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg> Generate`;
    promptEl.value = '';
  }, 1600);
});
</script>
</body>
</html>
